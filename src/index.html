<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<title>gregfont typesetter</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="style/base.css?v=2.7.0">
		<link rel="stylesheet" type="text/css" href="style/typesetter.css?v=2.7.0">
		<script>
			// apply the saved theme before the page paints
			try { document.documentElement.dataset.theme = localStorage.getItem('gregfont-theme') || localStorage.getItem('gregfont-editor-theme') || 'dark'; } catch (e) {}
		</script>
	</head>
	<body>
		<header id="topbar">
			<span class="brand">gregfont</span>
			<span class="product">typesetter</span>
			<nav id="menubar"></nav>
			<button type="button" id="tip" title="Tip: click for the next one"></button>
			<span id="status"></span>
			<button type="button" id="theme-toggle" class="icon-button" title="Switch light / dark" aria-label="Switch light / dark">
				<svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>
				<svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>
			</button>
			<a href="editor.html" target="_blank" class="link">Editor ↗</a>
			<button type="button" id="save" class="primary" title="Save as SVG, with the layout inside so it can be opened again (Ctrl+S)">Save SVG</button>
			<input type="file" id="open-file" accept=".svg,image/svg+xml" hidden>
		</header>

		<!-- left: the selected text's type settings -->
		<aside id="type-panel" aria-label="Type">
			<div class="type-head">
				<div class="type-title"><span class="panel-heading" id="type-title">New text</span><span class="meta" id="type-sub"></span></div>
				<label for="font-select" class="visually-hidden">Font</label>
				<select id="font-select"></select>
				<span id="font-meta" class="meta"></span>
			</div>

			<details class="fold" data-remember="character" open>
				<summary>Character</summary>
				<div class="field-pair">
					<label class="field" data-scrub="x" title="Size: the font's cell height in pixels"><span class="field-label">Size</span><input type="number" id="t-size" min="2" step="1"><span class="field-unit">px</span></label>
					<label class="field" data-scrub="x" title="Pen width in pixels"><span class="field-label">Pen</span><input type="number" id="t-pen" min="0.1" step="0.1"><span class="field-unit">px</span></label>
				</div>
				<div class="style-grid">
					<span class="field-label">Ends</span>
					<div class="segmented icons" id="t-cap" role="group" aria-label="Stroke ends">
						<button type="button" data-value="font" title="As the font draws them">Font</button>
						<button type="button" data-value="butt" title="Butt" aria-label="Butt ends"><svg viewBox="0 0 22 12"><line x1="3" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="6" stroke-linecap="butt"/><line class="mark" x1="15" y1="0" x2="15" y2="12"/></svg></button>
						<button type="button" data-value="round" title="Round" aria-label="Round ends"><svg viewBox="0 0 22 12"><line x1="3" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><line class="mark" x1="15" y1="0" x2="15" y2="12"/></svg></button>
						<button type="button" data-value="square" title="Square" aria-label="Square ends"><svg viewBox="0 0 22 12"><line x1="3" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="6" stroke-linecap="square"/><line class="mark" x1="15" y1="0" x2="15" y2="12"/></svg></button>
					</div>
					<span class="field-label">Pen colour</span>
					<div class="colour-row" id="t-colours">
						<label class="colour-pick" title="Any colour"><input type="color" id="t-colour" aria-label="Pen colour"></label>
					</div>
				</div>
				<label class="switch-label" title="For heavy strokes: stems that end on the baseline, x-height, cap height or descender reach as far past the line as round letters do. Only changes how this text is drawn and saved, not the font."><input type="checkbox" class="switch" id="t-extend"> Extend ends to guides</label>
			</details>

			<details class="fold" data-remember="spacing" open>
				<summary>Spacing</summary>
				<div class="field-triple">
					<label class="field" data-scrub="x" title="Letter spacing: a space's width, and the advance when monospaced"><span class="field-label">Letter</span><input type="number" id="t-letter" step="0.5"></label>
					<label class="field" data-scrub="x" title="Tracking: extra space after every letter (not monospaced)"><span class="field-label">Track</span><input type="number" id="t-track" step="0.5"></label>
					<label class="field" data-scrub="x" title="Line height"><span class="field-label">Line</span><input type="number" id="t-line" step="0.5" min="0"></label>
				</div>
				<label class="switch-label" title="Every character takes the same space"><input type="checkbox" class="switch" id="t-mono"> Monospaced</label>
			</details>

			<details class="fold" data-remember="paragraph" open>
				<summary>Paragraph</summary>
				<div class="style-grid">
					<span class="field-label">Align</span>
					<div class="segmented icons" id="t-align" role="group" aria-label="Alignment">
						<button type="button" data-value="left" title="Left" aria-label="Align left"><svg viewBox="0 0 16 12"><path d="M1 1.5h14M1 6h9M1 10.5h12" stroke="currentColor" stroke-width="1.5"/></svg></button>
						<button type="button" data-value="center" title="Centre" aria-label="Align centre"><svg viewBox="0 0 16 12"><path d="M1 1.5h14M3.5 6h9M2 10.5h12" stroke="currentColor" stroke-width="1.5"/></svg></button>
						<button type="button" data-value="right" title="Right" aria-label="Align right"><svg viewBox="0 0 16 12"><path d="M1 1.5h14M6 6h9M3 10.5h12" stroke="currentColor" stroke-width="1.5"/></svg></button>
					</div>
					<span class="field-label">Case</span>
					<div class="segmented" id="t-case" role="group" aria-label="Case">
						<button type="button" data-value="none" title="As typed">Aa</button>
						<button type="button" data-value="upper" title="All capitals">ABC</button>
						<button type="button" data-value="lower" title="All lower case">abc</button>
					</div>
				</div>
			</details>

			<details class="fold" data-remember="box" open>
				<summary>Box <span class="hint">px</span></summary>
				<div class="field-quad">
					<label class="field" data-scrub="x" title="Left edge"><span class="field-label">X</span><input type="number" id="t-x" step="1"></label>
					<label class="field" data-scrub="x" title="Top edge"><span class="field-label">Y</span><input type="number" id="t-y" step="1"></label>
					<label class="field" data-scrub="x" title="Width: the text wraps to it. Empty means no wrapping."><span class="field-label">W</span><input type="number" id="t-w" step="1" min="10" placeholder="auto"></label>
					<label class="field" data-scrub="x" title="Rotation in degrees"><span class="field-label">R</span><input type="number" id="t-rot" step="1"></label>
				</div>
			</details>
		</aside>

		<div id="optionsbar">
			<label class="switch-label" title="Show the text boxes and page margin"><input type="checkbox" class="switch" id="show-boxes" checked> Show boxes</label>
			<label class="switch-label" title="Show the pen-up moves a plotter will make"><input type="checkbox" class="switch" id="plot-preview"> Plot preview</label>
			<span class="spacer"></span>
			<button type="button" class="icon-button" id="zoom-out" title="Zoom out (Ctrl+-)" aria-label="Zoom out">&minus;</button>
			<button type="button" id="zoom-fit" class="zoom-label" title="Fit the page (Ctrl+0)">100%</button>
			<button type="button" class="icon-button" id="zoom-in" title="Zoom in (Ctrl+=)" aria-label="Zoom in">+</button>
			<span id="cursor-pos"></span>
		</div>

		<div id="canvas-wrap" tabindex="-1">
			<svg id="stage" aria-label="Page"></svg>
			<nav id="toolbox" aria-label="Tools">
				<button type="button" class="tool" data-tool="select" title="Select (V): click a text to select it, drag to move, drag the side handles to set where it wraps, double-click to edit" aria-label="Select (V)">
					<svg viewBox="0 0 20 20"><path d="M5 2.5v14l3.6-3.4 2.6 5.6 2.2-1-2.6-5.5h5z" fill="currentColor"/></svg>
				</button>
				<button type="button" class="tool" data-tool="text" title="Text (T): click to type, or drag to make a box that wraps" aria-label="Text (T)">
					<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5h12M10 4.5v12M7.5 16.5h5"/></svg>
				</button>
				<button type="button" class="tool" data-tool="hand" title="Hand (H): drag to move around the page (or hold Space)" aria-label="Hand (H)">
					<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M6.5 10V5a1.2 1.2 0 0 1 2.4 0v4M8.9 9V3.8a1.2 1.2 0 0 1 2.4 0V9M11.3 9V4.6a1.2 1.2 0 0 1 2.4 0V10M13.7 10V7a1.2 1.2 0 0 1 2.4 0v4.5c0 3-2 5.5-5.2 5.5-2.4 0-3.6-1-4.8-2.6L4 11.8a1.2 1.2 0 0 1 1.8-1.5l.7.8"/></svg>
				</button>
			</nav>
			<textarea id="text-input" aria-label="Text being edited" autocomplete="off" spellcheck="false"></textarea>
		</div>

		<!-- right: the document -->
		<aside id="doc-panel" aria-label="Document">
			<details class="fold" data-remember="texts" open>
				<summary>Texts <button type="button" id="add-text" class="text-button" title="New text box (T, then click the page)">+ Text box</button></summary>
				<div id="text-list"></div>
			</details>

			<details class="fold" data-remember="page" open>
				<summary>Page</summary>
				<div class="page-row">
					<label for="page-preset" class="visually-hidden">Page size</label>
					<select id="page-preset"></select>
					<div class="segmented icons" id="page-orient" role="group" aria-label="Orientation">
						<button type="button" data-value="portrait" title="Portrait" aria-label="Portrait"><svg viewBox="0 0 14 14"><rect x="3" y="1" width="8" height="12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
						<button type="button" data-value="landscape" title="Landscape" aria-label="Landscape"><svg viewBox="0 0 14 14"><rect x="1" y="3" width="12" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
					</div>
				</div>
				<div class="field-triple">
					<label class="field" data-scrub="x" title="Page width"><span class="field-label">W</span><input type="number" id="page-w" min="10" step="1"></label>
					<label class="field" data-scrub="x" title="Page height"><span class="field-label">H</span><input type="number" id="page-h" min="10" step="1"></label>
					<label class="field" data-scrub="x" title="Margin guide"><span class="field-label">M</span><input type="number" id="page-m" min="0" step="1"></label>
				</div>
				<p class="hint">Pixels at 96 per inch, so A4 is 1123 × 794. Plotter software converts them to millimetres.</p>
			</details>

			<details class="fold" data-remember="plot" open>
				<summary>Plot</summary>
				<span id="plot-info" class="meta"></span>
				<label class="switch-label" title="When saving and plotting, reorder and flip strokes across the page so the pen travels less with the pen up"><input type="checkbox" class="switch" id="plot-optimize"> Order strokes to cut pen-up travel</label>
				<div class="button-row two">
					<button type="button" id="play" title="Draw the page stroke by stroke, the way a plotter would">&#9654; Play</button>
					<button type="button" id="copy-svg" title="Copy the page as SVG">Copy SVG</button>
				</div>
			</details>
		</aside>

		<script src="libs/paper-core-0.12.18.min.js?v=2.7.0"></script>
		<script src="fonts/fonts.js?v=2.7.0"></script>
		<script src="js/gregfont.js?v=2.7.0"></script>
		<script src="js/version.js?v=2.7.0"></script>
		<script src="js/ui.js?v=2.7.0"></script>
		<script src="js/typesetter.js?v=2.7.0"></script>
	</body>
</html>
